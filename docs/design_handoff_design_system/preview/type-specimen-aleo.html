<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:14px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:16px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0;}
  .name{font-family:var(--font-sans);font-size:12px;color:var(--fg-secondary);font-weight:500;}
  .grid{display:grid;gap:12px;}
</style></head><body>
<div class="card">
  <div class="col" style="gap:10px;">
    <div style="font-family:var(--font-serif);font-size:48px;line-height:1.1;color:var(--fg-primary);letter-spacing:-0.01em;">Aa Bb Cc — 0123</div>
    <p style="font-family:var(--font-serif);font-size:16px;line-height:1.7;color:var(--fg-primary);margin:0;max-width:580px;text-wrap:pretty;">The quick brown fox jumps over the lazy dog. Slab serif designed for reading sizes. Italics carry weight; bold is used sparingly.</p>
    <div class="meta">Aleo · Regular / Italic / Bold · Body workhorse</div>
  </div>
</div></body></html>
