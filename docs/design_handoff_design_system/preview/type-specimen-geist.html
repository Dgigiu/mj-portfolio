<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:14px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:16px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0;}
  .name{font-family:var(--font-sans);font-size:12px;color:var(--fg-secondary);font-weight:500;}
  .grid{display:grid;gap:12px;}
</style></head><body>
<div class="card">
  <div class="col" style="gap:10px;">
    <div style="font-family:var(--font-sans);font-weight:700;font-size:48px;line-height:1.1;color:var(--fg-primary);letter-spacing:-0.025em;">Aa Bb Cc — 0123</div>
    <p style="font-family:var(--font-sans);font-size:14px;line-height:1.5;color:var(--fg-primary);margin:0;max-width:580px;">Geist replaces DIN Alternate. Neutral, restrained, designed as an interface face. Carries display, headings, UI, labels.</p>
    <div class="meta">Geist · 300 / 400 / 500 / 600 / 700 · Display + UI</div>
  </div>
</div></body></html>
