<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card" style="padding:0;">
  <div style="padding:24px 28px;border-bottom:1px solid var(--border-subtle);">
    <div class="mj-eyebrow" style="margin-bottom:8px;">CASE STUDY · 2024</div>
    <div class="mj-h2" style="margin-bottom:12px;">A patient migration</div>
    <p class="mj-body" style="margin:0;color:var(--fg-secondary);max-width:520px;">Three years of opinions consolidated into one tool. Most of the work was listening.</p>
  </div>
  <div style="padding:16px 28px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--border-subtle);">
    <span class="meta">space-8 → between content blocks</span>
    <span class="meta">space-6 → between paragraphs</span>
    <span class="meta">space-3 → label → heading</span>
  </div>
  <div style="padding:14px 28px;">
    <span class="meta">Tighter rhythm in nav/index; case studies use space-16/24 between sections.</span>
  </div>
</div></body></html>
