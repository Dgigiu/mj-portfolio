<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;align-items:flex-end;gap:6px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:4px;height:4px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">1</span>
        <span class="meta" style="color:var(--fg-muted);">4</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:8px;height:8px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">2</span>
        <span class="meta" style="color:var(--fg-muted);">8</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:12px;height:12px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">3</span>
        <span class="meta" style="color:var(--fg-muted);">12</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:16px;height:16px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">4</span>
        <span class="meta" style="color:var(--fg-muted);">16</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:20px;height:20px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">5</span>
        <span class="meta" style="color:var(--fg-muted);">20</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:24px;height:24px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">6</span>
        <span class="meta" style="color:var(--fg-muted);">24</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:32px;height:32px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">8</span>
        <span class="meta" style="color:var(--fg-muted);">32</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:40px;height:40px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">10</span>
        <span class="meta" style="color:var(--fg-muted);">40</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:48px;height:48px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">12</span>
        <span class="meta" style="color:var(--fg-muted);">48</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:64px;height:64px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">16</span>
        <span class="meta" style="color:var(--fg-muted);">64</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:80px;height:80px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">20</span>
        <span class="meta" style="color:var(--fg-muted);">80</span>
      </div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:96px;height:96px;background:#0088ff;border-radius:2px;"></div>
        <span class="meta">24</span>
        <span class="meta" style="color:var(--fg-muted);">96</span>
      </div>
  </div>
  <div class="meta" style="margin-top:14px;">8pt grid · tokens space-1 (4) through space-24 (96), with space-32/40 for page-level rhythm</div>
</div></body></html>
