<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:24px;align-items:flex-end;padding:8px 4px;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:48px;background:#fff;border-radius:4px;box-shadow:none;"></div>
        <span class="name">shadow-none</span>
        <span class="meta" style="color:var(--fg-muted);">—</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:48px;background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(24,24,24,0.04);"></div>
        <span class="name">shadow-xs</span>
        <span class="meta" style="color:var(--fg-muted);">hairline lift</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:48px;background:#fff;border-radius:4px;box-shadow:0 1px 2px rgba(24,24,24,0.06), 0 1px 1px rgba(24,24,24,0.03);"></div>
        <span class="name">shadow-sm</span>
        <span class="meta" style="color:var(--fg-muted);">cards on hover</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:48px;background:#fff;border-radius:4px;box-shadow:0 4px 14px rgba(24,24,24,0.06), 0 1px 2px rgba(24,24,24,0.04);"></div>
        <span class="name">shadow-md</span>
        <span class="meta" style="color:var(--fg-muted);">popovers</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:64px;height:48px;background:#fff;border-radius:4px;box-shadow:0 12px 32px rgba(24,24,24,0.08), 0 2px 4px rgba(24,24,24,0.04);"></div>
        <span class="name">shadow-lg</span>
        <span class="meta" style="color:var(--fg-muted);">modals</span>
      </div>
  </div>
  <div class="meta" style="margin-top:14px;">Restrained — sm is the maximum used in normal layout. Never coloured, never glow.</div>
</div></body></html>
