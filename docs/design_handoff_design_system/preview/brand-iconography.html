<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .row{display:flex;gap:14px;align-items:center;}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:24px;align-items:center;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="arrow-up-right" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">arrow-up-right</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="external-link" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">external-link</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="github" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">github</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="rss" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">rss</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="chevron-down" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">chevron-down</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <i data-lucide="arrow-right" style="width:22px;height:22px;color:#181818;stroke-width:1.5;"></i>
        <span class="meta">arrow-right</span>
      </div>
  </div>
  <div class="meta" style="margin-top:14px;">Lucide · 1.5px stroke · inherit currentColor · used sparingly, only where text would labor.</div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>lucide.createIcons();</script>
</div></body></html>
