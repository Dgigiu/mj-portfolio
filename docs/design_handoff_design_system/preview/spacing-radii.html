<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:16px;align-items:flex-end;">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:0px;"></div>
        <span class="name">none</span>
        <span class="meta">0px</span>
        <span class="meta" style="color:var(--fg-muted);">UI default</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:2px;"></div>
        <span class="name">xs</span>
        <span class="meta">2px</span>
        <span class="meta" style="color:var(--fg-muted);">—</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:4px;"></div>
        <span class="name">sm</span>
        <span class="meta">4px</span>
        <span class="meta" style="color:var(--fg-muted);">buttons</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:8px;"></div>
        <span class="name">md</span>
        <span class="meta">8px</span>
        <span class="meta" style="color:var(--fg-muted);">photos, capsules</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:12px;"></div>
        <span class="name">lg</span>
        <span class="meta">12px</span>
        <span class="meta" style="color:var(--fg-muted);">rare</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
        <div style="width:56px;height:56px;background:var(--bg-elevated);border:1px solid var(--border-subtle);border-radius:999px;"></div>
        <span class="name">pill</span>
        <span class="meta">pill</span>
        <span class="meta" style="color:var(--fg-muted);">tag pills, avatars</span>
      </div>
  </div>
  <div class="meta" style="margin-top:14px;">Square by default. Soft radii only on photographic media and accent capsules.</div>
</div></body></html>
