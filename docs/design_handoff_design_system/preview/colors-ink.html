<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
  .swatch{height:64px;border-radius:4px;border:1px solid var(--border-subtle);
    display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;}
  .swatch .label{font-size:10px;font-family:var(--font-mono);color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .swatch.dark .label{color:rgba(255,255,255,0.95);}
  .swatch.light .label{color:rgba(0,0,0,0.7);text-shadow:none;}
  .grid{display:grid;gap:8px;}
</style></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:repeat(7,1fr);">
    <div class="swatch dark" style="background:#181818;"><span class="label">ink-900<br>#181818</span></div>
    <div class="swatch dark" style="background:#333333;"><span class="label">ink-700<br>#333</span></div>
    <div class="swatch dark" style="background:#555555;"><span class="label">ink-500<br>#555</span></div>
    <div class="swatch dark" style="background:#747474;"><span class="label">ink-400<br>#747</span></div>
    <div class="swatch dark" style="background:#8d8d8d;"><span class="label">ink-300<br>#8d8d8d</span></div>
    <div class="swatch light" style="background:#b8b8b8;"><span class="label">ink-200<br>#b8b8b8</span></div>
    <div class="swatch light" style="background:#e3e0d8;"><span class="label">ink-100<br>#e3e0d8</span></div>
  </div>
  <div class="meta" style="margin-top:10px;">Near-black scale for text, dividers, disabled states</div>
</div></body></html>
