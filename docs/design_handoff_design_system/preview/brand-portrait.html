<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .row{display:flex;gap:14px;align-items:center;}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:18px;">
    <div style="position:relative;width:260px;height:160px;border-radius:8px;overflow:hidden;background:linear-gradient(135deg,#0e0e0e 0%,#0088ff 60%,#74beff 100%);flex-shrink:0;">
      <img src="../assets/miguel-portrait.png" style="position:absolute;left:50%;top:0;height:100%;transform:translateX(-50%);object-fit:cover;filter:grayscale(1) contrast(1.05);mix-blend-mode:luminosity;" />
    </div>
    <div style="display:flex;flex-direction:column;justify-content:center;gap:6px;">
      <span class="name">Hero portrait treatment</span>
      <p class="mj-body-sm" style="margin:0;max-width:300px;">B&W portrait over a black → accent-blue gradient. Reserved for the home page hero — not a recurring motif.</p>
      <span class="meta" style="margin-top:4px;">From Figma · social-thumbnail direction</span>
    </div>
  </div>
</div></body></html>
