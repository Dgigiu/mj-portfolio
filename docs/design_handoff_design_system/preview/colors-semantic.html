<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:12px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
  .swatch{height:64px;border-radius:4px;border:1px solid var(--border-subtle);
    display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px;}
  .swatch .label{font-size:10px;font-family:var(--font-mono);color:rgba(255,255,255,0.9);text-shadow:0 1px 2px rgba(0,0,0,0.3);}
  .swatch.dark .label{color:rgba(255,255,255,0.95);}
  .swatch.light .label{color:rgba(0,0,0,0.7);text-shadow:none;}
  .grid{display:grid;gap:8px;}
</style></head><body>
<div class="card">
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px;">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:3px;"></div>
      <span class="name">--bg-canvas</span><span class="meta">paper-100</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffefb;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#fffefb;border:1px solid #e6e0d0;border-radius:3px;"></div>
      <span class="name">--bg-elevated</span><span class="meta">paper-50</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#181818;border-radius:3px;"></div>
      <span class="name">--fg-primary</span><span class="meta">ink-900</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#555;border-radius:3px;"></div>
      <span class="name">--fg-secondary</span><span class="meta">ink-500</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#8d8d8d;border-radius:3px;"></div>
      <span class="name">--fg-muted</span><span class="meta">ink-300</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:#fffdf7;border:1px solid #e6e0d0;border-radius:4px;">
      <div style="width:18px;height:18px;background:#0088ff;border-radius:3px;"></div>
      <span class="name">--accent</span><span class="meta">#0088ff</span>
    </div>
  </div>
</div></body></html>
