<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:14px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:16px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0;}
  .name{font-family:var(--font-sans);font-size:12px;color:var(--fg-secondary);font-weight:500;}
  .grid{display:grid;gap:12px;}
</style></head><body>
<div class="card">
  <div class="col" style="gap:8px;">
    <div class="row" style="align-items:baseline;gap:20px;">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-0.025em;color:var(--fg-primary);">Display xl</span>
      <span class="meta">64 / 1.05 / -0.025em · Geist Bold</span>
    </div>
    <div class="row" style="align-items:baseline;gap:20px;">
      <span style="font-family:var(--font-sans);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-0.025em;color:var(--fg-primary);">Display lg</span>
      <span class="meta">52 / 1.05 / -0.025em · Geist Bold</span>
    </div>
    <div class="row" style="align-items:baseline;gap:20px;">
      <span style="font-family:var(--font-sans);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-0.018em;color:var(--fg-primary);">Display md</span>
      <span class="meta">40 / 1.1 / -0.018em · Geist Semibold</span>
    </div>
  </div>
</div></body></html>
