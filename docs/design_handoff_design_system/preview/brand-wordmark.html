<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .row{display:flex;gap:14px;align-items:center;}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:32px;align-items:center;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-family:var(--font-sans);font-weight:600;font-size:32px;color:#181818;letter-spacing:-0.02em;line-height:1;">Miguel Jesus</span>
      <span class="meta">Standard wordmark · Geist Semibold · #181818</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <span style="font-family:var(--font-sans);font-weight:500;font-size:18px;color:#181818;letter-spacing:-0.01em;line-height:1;">Miguel Jesus</span>
      <span class="meta">Nav scale · Geist Medium</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;padding:10px 14px;background:#181818;border-radius:4px;">
      <span style="font-family:var(--font-sans);font-weight:600;font-size:18px;color:#fffdf7;letter-spacing:-0.01em;line-height:1;">Miguel Jesus</span>
      <span class="meta" style="color:#8a867c;">On dark</span>
    </div>
  </div>
  <div class="meta" style="margin-top:14px;">Text-only wordmark — no symbol, no monogram. The Figma's "MJ" stays out of the system.</div>
</div></body></html>
