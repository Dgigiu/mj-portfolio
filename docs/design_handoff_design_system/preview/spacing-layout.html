<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:20px 24px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;flex-direction:column;gap:8px;">
    <div style="display:flex;align-items:center;gap:14px;">
        <div style="width:290.9090909090909px;height:6px;background:#181818;border-radius:1px;"></div>
        <span class="name">content-narrow</span><span class="meta">640px</span>
        <span class="meta" style="color:var(--fg-muted);">case-study prose width</span>
      </div><div style="display:flex;align-items:center;gap:14px;">
        <div style="width:327.27272727272725px;height:6px;background:#181818;border-radius:1px;"></div>
        <span class="name">content-prose</span><span class="meta">720px</span>
        <span class="meta" style="color:var(--fg-muted);">default prose</span>
      </div><div style="display:flex;align-items:center;gap:14px;">
        <div style="width:436.3636363636363px;height:6px;background:#181818;border-radius:1px;"></div>
        <span class="name">content-wide</span><span class="meta">960px</span>
        <span class="meta" style="color:var(--fg-muted);">wide image / table</span>
      </div><div style="display:flex;align-items:center;gap:14px;">
        <div style="width:545.4545454545454px;height:6px;background:#181818;border-radius:1px;"></div>
        <span class="name">content-page</span><span class="meta">1200px</span>
        <span class="meta" style="color:var(--fg-muted);">page max</span>
      </div>
  </div>
  <div class="meta" style="margin-top:14px;">Case study pages use narrower columns and more whitespace than the index.</div>
</div></body></html>
