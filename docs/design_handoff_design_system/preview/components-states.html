<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:13px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .meta{font-family:var(--font-mono);font-size:10.5px;color:var(--fg-tertiary);}
  .row{display:flex;gap:14px;align-items:center;}
  .name{font-family:var(--font-sans);font-size:11px;color:var(--fg-secondary);font-weight:500;}
</style></head><body>
<div class="card">
  <div style="display:flex;gap:18px;flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="padding:10px 14px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg-elevated);font-family:var(--font-sans);font-size:13px;">Default</div>
      <span class="meta">rest</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="padding:10px 14px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg-subtle);font-family:var(--font-sans);font-size:13px;">Hover</div>
      <span class="meta">bg → subtle</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="padding:10px 14px;border:1px solid #0088ff;border-radius:4px;background:var(--bg-elevated);font-family:var(--font-sans);font-size:13px;box-shadow:0 0 0 3px #e5f2ff;">Focus</div>
      <span class="meta">3px accent halo</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="padding:10px 14px;border:1px solid var(--border-subtle);border-radius:4px;background:var(--bg-canvas);font-family:var(--font-sans);font-size:13px;opacity:0.4;">Disabled</div>
      <span class="meta">0.4 opacity</span>
    </div>
  </div>
  <div class="meta" style="margin-top:14px;">Interaction primitives — 180ms ease-out · no transforms · no shadows on press.</div>
</div></body></html>
