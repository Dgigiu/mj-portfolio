<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:14px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:16px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0;}
  .name{font-family:var(--font-sans);font-size:12px;color:var(--fg-secondary);font-weight:500;}
  .grid{display:grid;gap:12px;}
</style></head><body>
<div class="card">
  <div class="col" style="gap:12px;">
    <div class="row" style="gap:20px;align-items:baseline;">
      <span class="mj-ui">UI text 14</span><span class="meta">Buttons, nav, form labels · Geist 14/1.45</span>
    </div>
    <div class="row" style="gap:20px;align-items:baseline;">
      <span class="mj-caption">Caption text 13</span><span class="meta">Tertiary metadata · Geist 13/1.45</span>
    </div>
    <div class="row" style="gap:20px;align-items:baseline;">
      <span class="mj-label">Label uppercase</span><span class="meta">Eyebrows, metadata caps · 12 / +0.08em</span>
    </div>
    <div class="row" style="gap:20px;align-items:baseline;">
      <span class="mj-eyebrow">Case study · 2024</span><span class="meta">Same as label but accent</span>
    </div>
    <div class="row" style="gap:20px;align-items:baseline;">
      <span class="mj-mono" style="background:var(--bg-subtle);padding:2px 8px;border-radius:4px;">code.snippet()</span>
      <span class="meta">Geist Mono · inline code</span>
    </div>
  </div>
</div></body></html>
