<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg-canvas);color:var(--fg-primary);
    font-family:var(--font-sans);min-height:100vh;font-size:14px;}
  .card{padding:24px 28px;box-sizing:border-box;width:100%;}
  .row{display:flex;gap:16px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:12px;}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--fg-tertiary);letter-spacing:0;}
  .name{font-family:var(--font-sans);font-size:12px;color:var(--fg-secondary);font-weight:500;}
  .grid{display:grid;gap:12px;}
</style></head><body>
<div class="card">
  <div class="col" style="gap:14px;">
    <div class="row" style="align-items:baseline;gap:16px;">
      <span class="mj-h1">Heading h1</span><span class="meta">32 / 1.25 / Geist Semibold</span>
    </div>
    <div class="row" style="align-items:baseline;gap:16px;">
      <span class="mj-h2">Heading h2</span><span class="meta">26 / 1.25 / Geist Semibold</span>
    </div>
    <div class="row" style="align-items:baseline;gap:16px;">
      <span class="mj-h3">Heading h3</span><span class="meta">22 / 1.45 / Geist Medium</span>
    </div>
    <div class="row" style="align-items:baseline;gap:16px;">
      <span class="mj-h4">Heading h4</span><span class="meta">19 / 1.45 / Geist Medium</span>
    </div>
  </div>
</div></body></html>
