<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miguel Jesus — Portfolio</title>
    <link rel="stylesheet" href="../../colors_and_type.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg-canvas);
        color: var(--fg-primary);
        font-family: var(--font-serif);
        font-size: var(--text-md);
        line-height: var(--leading-relaxed);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      a { color: inherit; }
      img { display: block; max-width: 100%; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      #root > main { flex: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="components.jsx"></script>
    <script type="text/babel" src="Nav.jsx"></script>
    <script type="text/babel" src="Home.jsx"></script>
    <script type="text/babel" src="CaseStudy.jsx"></script>
    <script type="text/babel" src="About.jsx"></script>

    <script type="text/babel">
      const { useEffect } = React;

      function App() {
        const [route, navigate] = useHashRoute();

        let view;
        if (route.startsWith("#/work/")) {
          const slug = route.slice("#/work/".length);
          view = <CaseStudy slug={slug} navigate={navigate} />;
        } else if (route.startsWith("#/about")) {
          view = <About />;
        } else if (route.startsWith("#/writing")) {
          view = (
            <main style={{ maxWidth: 640, margin: "0 auto", padding: "96px 32px" }}>
              <Eyebrow>Writing</Eyebrow>
              <h1 className="mj-display-md" style={{ margin: "0 0 20px", letterSpacing: "-0.02em" }}>
                Notes on the craft.
              </h1>
              <p className="mj-prose" style={{ color: "var(--fg-secondary)" }}>
                I've been writing this section for two years. Drafts are due. Check back.
              </p>
            </main>
          );
        } else {
          view = <Home navigate={navigate} />;
        }

        return (
          <>
            <Nav route={route} navigate={navigate} />
            {view}
            <Footer />
          </>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
